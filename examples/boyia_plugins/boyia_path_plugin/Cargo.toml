[package]
name = "boyia_path_plugin"
version = "0.1.0"
edition = "2021"
description = "Boyia Path builtin as a dylib plugin"
build = "../../boyia_plugin_sdk/build/plugin_install.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
boyia_plugin_sdk = { path = "../../boyia_plugin_sdk" }

[build-dependencies]
boyia_plugin_sdk = { path = "../../boyia_plugin_sdk", features = ["build-install"] }
